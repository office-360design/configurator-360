or="end">no cumple →</text><text x="236" y="50" font-size="11" fill="var(--warn)" text-anchor="end">cambie el vidrio,</text><text x="236" y="64" font-size="11" fill="var(--warn)" text-anchor="end">el módulo o el apoyo</text></svg></div><figcaption>El motor común (columna central) es el mismo para todos los sistemas. La única etapa que cambia según el sistema es la quinta: cómo se sujeta el vidrio. Cada junta de la retícula recibe uno de los cuatro tipos de sujeción de la derecha, y de ahí salen las grapas, el perfil-U, los bastidores o la silicona de la lista de materiales. La línea discontinua naranja es el bucle de corrección: si un vidrio no cumple (apoyo, unión, grapas, tamaño), el configurador pide un cambio en las entradas.</figcaption></figure>
