nd">non conforme →</text><text x="236" y="50" font-size="11" fill="var(--warn)" text-anchor="end">changer le vitrage,</text><text x="236" y="64" font-size="11" fill="var(--warn)" text-anchor="end">le module ou le support</text></svg></div><figcaption>Le moteur commun (colonne centrale) est le même pour tous les systèmes. La seule étape qui change selon le système est la cinquième : la façon dont le vitrage est fixé. Chaque joint de la trame reçoit l'un des quatre types de fixation de droite, d'où viennent les agrafes, le profil U, les cadres ou le silicone de la liste de matériaux. La ligne orange en pointillé est la boucle de correction : si un vitrage n'est pas conforme (support, assemblage, agrafes, dimensions), le configurateur demande une modification des entrées.</figcaption></figure>
