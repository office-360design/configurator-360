<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>Window AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; }
        model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 35%, #172554, #020617 72%); }
        #launch {
            position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
            padding: 24px; background: radial-gradient(circle at 50% 35%, rgba(23,37,84,.97), rgba(2,6,23,.99) 72%);
        }
        #launch.hidden { display: none; }
        .card { width: min(420px, 100%); text-align: center; }
        h1 { margin: 0 0 12px; font-size: clamp(30px, 8vw, 46px); color: #60a5fa; }
        p { margin: 0 0 22px; color: #cbd5e1; line-height: 1.55; }
        button {
            width: 100%; border: 0; border-radius: 16px; padding: 17px 22px;
            background: #2563eb; color: white; font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: progress; }
        #status { min-height: 24px; margin-top: 14px; color: #bfdbfe; font-size: 14px; line-height: 1.45; }
        #status.error { color: #fca5a5; }
        #native-ar-button { display: none; }
    </style>
</head>
<body>
    <model-viewer id="viewer"
        ar
        ar-modes="scene-viewer webxr"
        ar-scale="fixed"
        ar-placement="floor"
        camera-controls
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        reveal="auto">
        <button id="native-ar-button" slot="ar-button">Open AR</button>
    </model-viewer>

    <div id="launch">
        <div class="card">
            <h1>Window AR</h1>
            <p>Open the camera and place the configured window at real scale.</p>
            <button id="launch-button" type="button" disabled>Checking model…</button>
            <div id="status">Verifying the generated 3D model…</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const modelParam = params.get('model');
        const viewer = document.getElementById('viewer');
        const launch = document.getElementById('launch');
        const launchButton = document.getElementById('launch-button');
        const status = document.getElementById('status');
        let modelReady = false;

        function showError(message) {
            status.classList.add('error');
            status.textContent = message;
            launchButton.disabled = true;
            launchButton.textContent = 'Model unavailable';
        }

        let modelUrl = '';
        try {
            modelUrl = new URL(modelParam || '', location.href).href;
        } catch (_) {}

        if (!modelParam || !/^https?:/i.test(modelUrl)) {
            showError('The AR model address is missing or invalid.');
        } else {
            viewer.src = modelUrl;
        }

        viewer.addEventListener('load', () => {
            modelReady = true;
            status.classList.remove('error');
            status.textContent = 'Model ready.';
            launchButton.disabled = false;
            launchButton.textContent = 'Open camera';
        });

        viewer.addEventListener('error', event => {
            const detail = event?.detail?.type ? ` (${event.detail.type})` : '';
            showError(`The generated model could not be loaded${detail}. Generate a new QR after updating the configurator.`);
        });

        function buildSceneViewerIntent() {
            const fallback = new URL(location.href);
            fallback.searchParams.set('fallback', '1');
            const query = [
                `file=${encodeURIComponent(modelUrl)}`,
                'mode=ar_only',
                'resizable=false',
                'enable_vertical_placement=true'
            ].join('&');
            return `intent://arvr.google.com/scene-viewer/1.0?${query}` +
                `#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;` +
                `S.browser_fallback_url=${encodeURIComponent(fallback.href)};end;`;
        }

        async function launchAR() {
            if (!modelUrl || !modelReady) return;
            status.classList.remove('error');
            status.textContent = '';

            const isAndroid = /Android/i.test(navigator.userAgent);
            if (isAndroid && params.get('fallback') !== '1') {
                location.href = buildSceneViewerIntent();
                return;
            }

            try {
                await viewer.activateAR();
                launch.classList.add('hidden');
            } catch (error) {
                status.classList.add('error');
                status.textContent = `${error.name || 'AR error'}: ${error.message || 'Could not start AR.'}`;
            }
        }

        launchButton.addEventListener('click', launchAR);

        viewer.addEventListener('ar-status', event => {
            if (event.detail.status === 'session-started') {
                launch.classList.add('hidden');
            } else if (event.detail.status === 'failed') {
                status.classList.add('error');
                status.textContent = 'The native AR viewer could not open this model. Try again after regenerating the QR.';
            }
        });
    </script>
</body>
</html>
