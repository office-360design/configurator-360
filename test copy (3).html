<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Fereastră Oscilo-Batantă - Profil Complex</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #controls { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; z-index: 10; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        input[type="number"], input[type="range"] { width: 100%; margin-bottom: 10px; }
        label { font-weight: bold; font-size: 13px; color: #333; }
        .mode-select, .action-box { margin-bottom: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .highlight { color: #d32f2f; }
    </style>
</head>
<body>

<div id="controls">
    <label>Lățime (A):</label>
    <input type="number" id="widthA" value="1.2" step="0.1">
    <label>Înălțime (B):</label>
    <input type="number" id="heightB" value="1.5" step="0.1">

    <div class="mode-select">
        <label>Mod deschidere:</label><br>
        <input type="radio" id="mBatant" name="mode" value="batant" checked> Batant (Lateral)<br>
        <input type="radio" id="mOscilo" name="mode" value="oscilo"> Oscilo (15° Sus)
    </div>
    
    <label>Unghi deschidere:</label>
    <input type="range" id="openAngle" min="0" max="1.5" step="0.01" value="0.0">

    <div class="action-box">
        <label class="highlight">Vedere Explodată:</label>
        <input type="checkbox" id="cExplode">
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // SCENE & RENDERER
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xddeeff);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(1, 0.5, 2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; 
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    // Pământul (Plan gri la baza ferestrei)
    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2; // Poziționat sub fereastră
    ground.receiveShadow = true;
    scene.add(ground);

    // LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(2, 5, 4);
    dirLight.castShadow = true; 
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0005;
    dirLight.shadow.normalBias = 0.02;
    scene.add(dirLight);

    // MATERIALS
    const matFrameH = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.3, side: THREE.DoubleSide, flatShading: true }); 
    const matFrameV = new THREE.MeshStandardMaterial({ color: 0x0055ff, roughness: 0.3, side: THREE.DoubleSide, flatShading: true }); 
    
    // Sash Colors (Orange Horizontal, Green Vertical)
    const matSashH = new THREE.MeshStandardMaterial({ color: 0xffa500, roughness: 0.3, side: THREE.DoubleSide, flatShading: true }); 
    const matSashV = new THREE.MeshStandardMaterial({ color: 0x008000, roughness: 0.3, side: THREE.DoubleSide, flatShading: true }); 
    
    // Bead Colors (Yellow, Light Blue)
    const matBeadH = new THREE.MeshStandardMaterial({ color: 0xffff00, roughness: 0.4, side: THREE.DoubleSide, flatShading: true }); 
    const matBeadV = new THREE.MeshStandardMaterial({ color: 0x800080, roughness: 0.4, side: THREE.DoubleSide, flatShading: true });

    const matHandle = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.2 }); 
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.1 });

    // --- 1. DEFINE COMPLEX SHAPES (From Original File) ---
    const S = 0.015; // Scale Factor: converts huge profile coordinates to realistic meters
    
    // A. Frame Shape (Green in original)
    const frameShape = new THREE.Shape();
    frameShape.moveTo(0,0); frameShape.lineTo(0,4); frameShape.lineTo(1,4); frameShape.lineTo(1,2.5);
    frameShape.lineTo(4,2.5); frameShape.lineTo(4,0); frameShape.lineTo(0,0);

    const h1 = new THREE.Path(); h1.moveTo(0.1,0.1); h1.lineTo(0.1,0.95); h1.lineTo(0.45,0.95); h1.lineTo(0.45,0.1); h1.lineTo(0.1,0.1); frameShape.holes.push(h1);
    const h2 = new THREE.Path(); h2.moveTo(0.55,0.1); h2.lineTo(0.55,0.95); h2.lineTo(0.90,1.95); h2.lineTo(0.90,0.1); h2.lineTo(0.55,0.1); frameShape.holes.push(h2);
    const h3 = new THREE.Path(); h3.moveTo(0.1,1.05); h3.lineTo(0.1,2.95); h3.lineTo(0.90,2.95); h3.lineTo(0.90,2.15); h3.lineTo(0.5,1.05); h3.lineTo(0.1,1.05); frameShape.holes.push(h3);
    const h4 = new THREE.Path(); h4.moveTo(0.1,3.05); h4.lineTo(0.1,3.90); h4.lineTo(0.90,3.90); h4.lineTo(0.90,3.05); h4.lineTo(0.1,3.05); frameShape.holes.push(h4);
    const h5 = new THREE.Path(); h5.moveTo(1,0.1); h5.lineTo(1,2.4); h5.lineTo(3,2.4); h5.lineTo(3,0.1); h5.lineTo(1,0.1); frameShape.holes.push(h5);
    const h6 = new THREE.Path(); h6.moveTo(3.1,0.1); h6.lineTo(3.1,2.4); h6.lineTo(3.9,2.4); h6.lineTo(3.9,0.1); h6.lineTo(3.1,0.1); frameShape.holes.push(h6);

    // B. Sash Shape (Blue in original)
    const sashShape = new THREE.Shape();
    sashShape.moveTo(1,3.5); sashShape.lineTo(1,7.5); sashShape.lineTo(2,7.5); sashShape.lineTo(2,6); sashShape.lineTo(4,6);
    sashShape.lineTo(4,6.5); sashShape.lineTo(4.2,6.5); sashShape.lineTo(4.2,6.4); sashShape.lineTo(4.1,6.4); sashShape.lineTo(4.1,6);
    sashShape.lineTo(4.9,6); sashShape.lineTo(4.9,6.4); sashShape.lineTo(4.5,6.4); sashShape.lineTo(4.5,6.5); sashShape.lineTo(5,6.5);
    sashShape.lineTo(5,2); sashShape.lineTo(4,2); sashShape.lineTo(4,3.5); sashShape.lineTo(3.5,3.5); sashShape.lineTo(3.5,4.5);
    sashShape.lineTo(2.5,4.5); sashShape.lineTo(2.5,3.5); sashShape.lineTo(1,3.5);

    const h7 = new THREE.Path(); h7.moveTo(1.1,3.6); h7.lineTo(1.1,6.45); h7.lineTo(1.9,6.45); h7.lineTo(1.9,3.6); h7.lineTo(1.1,3.6); sashShape.holes.push(h7);
    const h8 = new THREE.Path(); h8.moveTo(1.1,6.6); h8.lineTo(1.1,7.4); h8.lineTo(1.9,7.4); h8.lineTo(1.9,6.6); h8.lineTo(1.1,6.6); sashShape.holes.push(h8);
    const h9 = new THREE.Path(); h9.moveTo(2,3.6); h9.lineTo(2,5.9); h9.lineTo(4,5.9); h9.lineTo(4,3.6); h9.lineTo(3.6,3.6); h9.lineTo(3.6,4.6); h9.lineTo(2.4,4.6); h9.lineTo(2.4,3.6); h9.lineTo(2,3.6); sashShape.holes.push(h9);
    const h10 = new THREE.Path(); h10.moveTo(4.1,3.6); h10.lineTo(4.1,5.9); h10.lineTo(4.9,5.9); h10.lineTo(4.9,3.6); h10.lineTo(4.1,3.6); sashShape.holes.push(h10);
    const h11 = new THREE.Path(); h11.moveTo(4.1,2.8); h11.lineTo(4.1,3.5); h11.lineTo(4.9,3.5); h11.lineTo(4.9,2.8); h11.lineTo(4.1,2.8); sashShape.holes.push(h11);
    const h12 = new THREE.Path(); h12.moveTo(4.1,2.1); h12.lineTo(4.1,2.7); h12.lineTo(4.9,2.7); h12.lineTo(4.9,2.1); h12.lineTo(4.1,2.1); sashShape.holes.push(h12);

    // C. Bead Shape (Red in original)
    const beadShape = new THREE.Shape();
    beadShape.moveTo(4,6.5); beadShape.lineTo(4,7.5); beadShape.lineTo(5,7.5); beadShape.lineTo(5,6.5);
    beadShape.lineTo(4.5,6.5); beadShape.lineTo(4.5,6.1); beadShape.lineTo(4.3,6.1); beadShape.lineTo(4.3,6.5); beadShape.lineTo(4,6.5);
    
    const h13 = new THREE.Path(); h13.moveTo(4.1,6.6); h13.lineTo(4.1,7.4); h13.lineTo(4.9,7.4); h13.lineTo(4.9,6.6); h13.lineTo(4.1,6.6); beadShape.holes.push(h13);

    // EXPLOSION LOGIC
    let isExploded = false;
    let explodeProgress = 0;
    let explodableObjects = [];

    const expCheckbox = document.getElementById('cExplode');
    window.addEventListener('keydown', (e) => {
        if(e.key.toLowerCase() === 'x') {
            isExploded = !isExploded;
            expCheckbox.checked = isExploded;
        }
    });
    expCheckbox.addEventListener('change', (e) => { isExploded = e.target.checked; });

    function setupExplode(obj, dx, dy, dz) {
        obj.userData.basePos = obj.position.clone();
        obj.userData.explodeDir = new THREE.Vector3(dx, dy, dz);
        explodableObjects.push(obj);
    }

    // --- 2. THE MITER ENGINE ---
    // Extrudes a profile shape, applies scale, and cuts vertices mathematically to form a 45 degree corner.
    function createMiteredSide(shape, lengthA, lengthB, side, material, expDist) {
        const isHorizontal = side === 'bottom' || side === 'top';
        const length = isHorizontal ? lengthA : lengthB;

        const extrudeSettings = { depth: length, bevelEnabled: false, curveSegments: 1, steps: 1 };
        const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);

        const posAttribute = geom.attributes.position;
        const v = new THREE.Vector3();
        
        for (let i = 0; i < posAttribute.count; i++) {
            v.fromBufferAttribute(posAttribute, i);
            let u = v.x * S;       // Depth of profile (Exterior to Interior)
            let inw = v.y * S;     // Inward direction towards center of glass
            let zRaw = v.z - length / 2; 

            // Mathematically sheer the ends to create a 45 degree Miter Joint
            let z_cut = zRaw > 0 ? zRaw - inw : zRaw + inw;

            // Map and Orient to the 4 sides of the window while preserving positive winding order (Det = 1)
            let xw, yw, zw = u;
            if (side === 'bottom') { xw = -z_cut; yw = -lengthB/2 + inw; }
            if (side === 'top')    { xw =  z_cut; yw =  lengthB/2 - inw; }
            if (side === 'left')   { xw = -lengthA/2 + inw; yw =  z_cut; }
            if (side === 'right')  { xw =  lengthA/2 - inw; yw = -z_cut; }

            posAttribute.setXYZ(i, xw, yw, zw);
        }
        geom.computeVertexNormals();

        const mesh = new THREE.Mesh(geom, material);
        mesh.castShadow = true; mesh.receiveShadow = true;

        let expX = 0, expY = 0;
        if (side === 'bottom') expY = -expDist;
        if (side === 'top')    expY = expDist;
        if (side === 'left')   expX = -expDist;
        if (side === 'right')  expX = expDist;
        
        setupExplode(mesh, expX, expY, expDist * 0.2); 
        return mesh;
    }

    // --- 3. ASSEMBLE WINDOW ---
    const mainGroup = new THREE.Group();
    const pivotOscilo = new THREE.Group(); 
    const pivotBatant = new THREE.Group(); 
    let handleLeverGroup = new THREE.Group();
    scene.add(mainGroup);

    function buildWindow() {
        while(mainGroup.children.length > 0) mainGroup.remove(mainGroup.children[0]);
        pivotOscilo.clear();
        pivotBatant.clear();
        explodableObjects = [];

        const A = parseFloat(document.getElementById('widthA').value);
        const B = parseFloat(document.getElementById('heightB').value);
        
        const frameGroup = new THREE.Group();
        const sashGroup = new THREE.Group();
        const beadGroup = new THREE.Group();

        ['bottom', 'top', 'left', 'right'].forEach(side => {
            // Check if the current side is horizontal or vertical
            const isHorizontal = side === 'bottom' || side === 'top';
            
            // Pick the appropriate material based on orientation
            const frameMat = isHorizontal ? matFrameH : matFrameV;
            const sashMat = isHorizontal ? matSashH : matSashV;
            const beadMat = isHorizontal ? matBeadH : matBeadV;

            // Generate and add the mitered sides
            frameGroup.add(createMiteredSide(frameShape, A, B, side, frameMat, 0.2));
            sashGroup.add(createMiteredSide(sashShape, A, B, side, sashMat, 0.4));
            beadGroup.add(createMiteredSide(beadShape, A, B, side, beadMat, 0.6));
        });
        mainGroup.add(frameGroup);

        // Glass
        const glassW = A - 2 * (6.1 * S);
        const glassH = B - 2 * (6.1 * S);
        const glass = new THREE.Mesh(new THREE.BoxGeometry(glassW, glassH, 0.024), glassMat);
        glass.position.set(0, 0, 3.0 * S); 
        
        setupExplode(glass, 0, 0, 0.8);
        sashGroup.add(glass);

        // Handle
        const handleBase = new THREE.Group();
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, 0.02), matHandle);
        handleLeverGroup = new THREE.Group();
        const lever = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.16, 0.03), matHandle);
        lever.position.y = -0.06; 
        lever.castShadow = true;
        handleLeverGroup.add(lever);
        handleBase.add(plate, handleLeverGroup);
        
        handleBase.position.set(A/2 - 4*S, 0, 5*S + 0.01);
        setupExplode(handleBase, 0.5, 0, 1.2); 
        sashGroup.add(handleBase);

        // Calculate precise Hinge Offsets dynamically based on the shape limits
        const hingeX = -A/2 + 3*S;
        const hingeY = -B/2 + 3*S;
        const hingeZ = 4.5*S;

        pivotOscilo.position.set(0, hingeY, hingeZ);
        mainGroup.add(pivotOscilo);

        pivotBatant.position.set(hingeX, -hingeY, 0);
        pivotOscilo.add(pivotBatant);

        // Wrapping sash logic so standard rotations act around the localized pivots seamlessly
        const sashWrapper = new THREE.Group();
        sashWrapper.position.set(-hingeX, 0, -hingeZ);
        sashWrapper.add(sashGroup, beadGroup);
        pivotBatant.add(sashWrapper);
    }

    // --- 4. ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        const val = parseFloat(document.getElementById('openAngle').value);
        const isBatant = document.getElementById('mBatant').checked;

        // Opening Physics
        if (isBatant) {
            pivotBatant.rotation.y = -val;
            pivotOscilo.rotation.x = 0;
            if (handleLeverGroup) handleLeverGroup.rotation.z = THREE.MathUtils.lerp(handleLeverGroup.rotation.z, Math.PI, 0.1);
        } else {
            pivotBatant.rotation.y = 0;
            const maxOscilo = 15 * (Math.PI / 180);
            pivotOscilo.rotation.x = Math.min(val * 0.25, maxOscilo);
            if (handleLeverGroup) handleLeverGroup.rotation.z = THREE.MathUtils.lerp(handleLeverGroup.rotation.z, Math.PI/2, 0.1);
        }

        // Explosion Physics
        explodeProgress = THREE.MathUtils.lerp(explodeProgress, isExploded ? 1 : 0, 0.05);
        explodableObjects.forEach(obj => {
            if(obj.userData.basePos && obj.userData.explodeDir) {
                obj.position.copy(obj.userData.basePos).addScaledVector(obj.userData.explodeDir, explodeProgress);
            }
        });

        controls.update(); 
        renderer.render(scene, camera);
    }

    document.getElementById('widthA').oninput = buildWindow;
    document.getElementById('heightB').oninput = buildWindow;
    buildWindow();
    animate();
    window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
</script>
</body>
</html>
