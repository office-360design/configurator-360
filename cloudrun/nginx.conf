        "~^1:(?:GET|HEAD):/ro:/configurators/cardbox(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/cutii-carton;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/cutii-carton(?:/index\.html|/)(?:\?.*)?$" /configuratoare/cutii-carton;
