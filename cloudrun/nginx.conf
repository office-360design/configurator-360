events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;


    # Edge-provided visitor country used only to choose guest UI defaults.
    # The client IP itself is never returned to the browser.
    map $http_cf_ipcountry $geo_country_code {
        default $http_cf_ipcountry;
        "" $http_x_country_code;
    }

    map $host $site_prefix {
        default "";
        www.360configurator.ro /ro;
        www.360konfigurator.de /de;
    }

    map $host $public_origin {
        default https://www.360configurator.com;
        www.360configurator.ro https://www.360configurator.ro;
        www.360konfigurator.de https://www.360konfigurator.de;
    }

    map $host $sitemap_file {
        default /sitemap-en.xml;
        www.360configurator.ro /sitemap-ro.xml;
        www.360konfigurator.de /sitemap-de.xml;
    }

    map $host $is_internal_admin_host {
        default 0;
        www.360configurator.com 1;
    }

    # One customer identity across the three supported country domains.
    # Reserved names never become tenants, even though wildcard DNS resolves.
    map $host $tenant_slug {
        default "";
        "~^(?:www|aks|admin|api|app|assets|auth|billing|cdn|demo|dev|ftp|mail|staging|static|status|support|test)\.(?:360configurator\.com|360configurator\.ro|360konfigurator\.de)$" "";
        "~^(?<customer_slug>[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?)\.(?:360configurator\.com|360configurator\.ro|360konfigurator\.de)$" $customer_slug;
    }

    map $tenant_slug $is_tenant_host {
        "" 0;
        default 1;
    }

    # Tenant document URLs use the public site's naming for the current domain.
    # Match the ORIGINAL request URI: localized routes internally rewrite to the
    # English asset directories, and inspecting $uri would create redirect loops.
    # Only entry documents are canonicalized; JS/CSS/models stay at either path.
    map "$is_tenant_host:$host" $tenant_route_locale {
        default "";
        ~^1:.*\.360configurator\.com$ en-US;
        ~^1:.*\.360configurator\.ro$ ro-RO;
        ~^1:.*\.360konfigurator\.de$ de-DE;
    }

    # Mirrors CONFIGURATOR_PUBLIC_PATHS in shared-ui/src/config.js. The nginx
    # regression tests compare every public and tenant route against that source.
    map "$tenant_route_locale:$request_uri" $tenant_configurator_redirect {
        default "";

        # en-US
        "~^en-US:/(?:configurator-pergola|pergola-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /pergola-configurator/;
        "~^en-US:/pergola-configurator(?:/index\.html)?(?:\?.*)?$" /pergola-configurator/;
        "~^en-US:/(?:configurator-acoperis|dach-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /roof-configurator/;
        "~^en-US:/roof-configurator(?:/index\.html)?(?:\?.*)?$" /roof-configurator/;
        "~^en-US:/(?:configurator-ferestre|fenster-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /window-configurator/;
        "~^en-US:/window-configurator(?:/index\.html)?(?:\?.*)?$" /window-configurator/;
        "~^en-US:/(?:configurator-hala|hallen-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /hall-configurator/;
        "~^en-US:/hall-configurator(?:/index\.html)?(?:\?.*)?$" /hall-configurator/;
        "~^en-US:/(?:configurator-solar|solar-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /solar-configurator/;
        "~^en-US:/solar-configurator(?:/index\.html)?(?:\?.*)?$" /solar-configurator/;
        "~^en-US:/(?:configurator-garduri|zaun-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /fence-configurator/;
        "~^en-US:/fence-configurator(?:/index\.html)?(?:\?.*)?$" /fence-configurator/;
        "~^en-US:/(?:configurator-cutii-carton|karton-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /cardbox-configurator/;
        "~^en-US:/cardbox-configurator(?:/index\.html)?(?:\?.*)?$" /cardbox-configurator/;
        "~^en-US:/bookshelf-configurator(?:/index\.html)?(?:\?.*)?$" /bookshelf-configurator/;
        "~^en-US:/tiles-configurator(?:/index\.html)?(?:\?.*)?$" /tiles-configurator/;
        "~^en-US:/(?:configurator-scaune|stuhl-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /chair-configurator/;
        "~^en-US:/chair-configurator(?:/index\.html)?(?:\?.*)?$" /chair-configurator/;

        # ro-RO
        "~^ro-RO:/(?:pergola-configurator|pergola-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-pergola/;
        "~^ro-RO:/configurator-pergola(?:/index\.html)?(?:\?.*)?$" /configurator-pergola/;
        "~^ro-RO:/(?:roof-configurator|dach-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-acoperis/;
        "~^ro-RO:/configurator-acoperis(?:/index\.html)?(?:\?.*)?$" /configurator-acoperis/;
        "~^ro-RO:/(?:window-configurator|fenster-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-ferestre/;
        "~^ro-RO:/configurator-ferestre(?:/index\.html)?(?:\?.*)?$" /configurator-ferestre/;
        "~^ro-RO:/(?:hall-configurator|hallen-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-hala/;
        "~^ro-RO:/configurator-hala(?:/index\.html)?(?:\?.*)?$" /configurator-hala/;
        "~^ro-RO:/(?:solar-configurator|solar-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-solar/;
        "~^ro-RO:/configurator-solar(?:/index\.html)?(?:\?.*)?$" /configurator-solar/;
        "~^ro-RO:/(?:fence-configurator|zaun-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-garduri/;
        "~^ro-RO:/configurator-garduri(?:/index\.html)?(?:\?.*)?$" /configurator-garduri/;
        "~^ro-RO:/(?:cardbox-configurator|karton-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-cutii-carton/;
        "~^ro-RO:/configurator-cutii-carton(?:/index\.html)?(?:\?.*)?$" /configurator-cutii-carton/;
        "~^ro-RO:/bookshelf-configurator(?:/index\.html)?(?:\?.*)?$" /bookshelf-configurator/;
        "~^ro-RO:/tiles-configurator(?:/index\.html)?(?:\?.*)?$" /tiles-configurator/;
        "~^ro-RO:/(?:chair-configurator|stuhl-konfigurator)(?:/index\.html|/)?(?:\?.*)?$" /configurator-scaune/;
        "~^ro-RO:/configurator-scaune(?:/index\.html)?(?:\?.*)?$" /configurator-scaune/;

        # de-DE
        "~^de-DE:/(?:pergola-configurator|configurator-pergola)(?:/index\.html|/)?(?:\?.*)?$" /pergola-konfigurator/;
        "~^de-DE:/pergola-konfigurator(?:/index\.html)?(?:\?.*)?$" /pergola-konfigurator/;
        "~^de-DE:/(?:roof-configurator|configurator-acoperis)(?:/index\.html|/)?(?:\?.*)?$" /dach-konfigurator/;
        "~^de-DE:/dach-konfigurator(?:/index\.html)?(?:\?.*)?$" /dach-konfigurator/;
        "~^de-DE:/(?:window-configurator|configurator-ferestre)(?:/index\.html|/)?(?:\?.*)?$" /fenster-konfigurator/;
        "~^de-DE:/fenster-konfigurator(?:/index\.html)?(?:\?.*)?$" /fenster-konfigurator/;
        "~^de-DE:/(?:hall-configurator|configurator-hala)(?:/index\.html|/)?(?:\?.*)?$" /hallen-konfigurator/;
        "~^de-DE:/hallen-konfigurator(?:/index\.html)?(?:\?.*)?$" /hallen-konfigurator/;
        "~^de-DE:/(?:solar-configurator|configurator-solar)(?:/index\.html|/)?(?:\?.*)?$" /solar-konfigurator/;
        "~^de-DE:/solar-konfigurator(?:/index\.html)?(?:\?.*)?$" /solar-konfigurator/;
        "~^de-DE:/(?:fence-configurator|configurator-garduri)(?:/index\.html|/)?(?:\?.*)?$" /zaun-konfigurator/;
        "~^de-DE:/zaun-konfigurator(?:/index\.html)?(?:\?.*)?$" /zaun-konfigurator/;
        "~^de-DE:/(?:cardbox-configurator|configurator-cutii-carton)(?:/index\.html|/)?(?:\?.*)?$" /karton-konfigurator/;
        "~^de-DE:/karton-konfigurator(?:/index\.html)?(?:\?.*)?$" /karton-konfigurator/;
        "~^de-DE:/bookshelf-configurator(?:/index\.html)?(?:\?.*)?$" /bookshelf-configurator/;
        "~^de-DE:/tiles-configurator(?:/index\.html)?(?:\?.*)?$" /tiles-configurator/;
        "~^de-DE:/(?:chair-configurator|configurator-scaune)(?:/index\.html|/)?(?:\?.*)?$" /stuhl-konfigurator/;
        "~^de-DE:/stuhl-konfigurator(?:/index\.html)?(?:\?.*)?$" /stuhl-konfigurator/;
    }

    server {
        listen 8080;
        server_name 360configurator.com;
        return 301 https://www.360configurator.com$request_uri;
    }

    server {
        listen 8080;
        server_name 360configurator.ro;
        return 301 https://www.360configurator.ro$request_uri;
    }

    server {
        listen 8080;
        server_name 360konfigurator.de;
        return 301 https://www.360konfigurator.de$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name www.360configurator.com aks.360configurator.com www.360configurator.ro www.360konfigurator.de _;

        root /usr/share/nginx/html;
        index index.html;

        # Preserve tenant identity, query transport and HTTPS when old links are
        # opened. Canonical pages are not matched, even after internal rewrites.
        if ($tenant_configurator_redirect) {
            return 301 https://$host$tenant_configurator_redirect$is_args$args;
        }

        # Firebase Authentication first-party helper proxy. The browser keeps the
        # /__/auth/* URL on the current 360Configurator domain while nginx
        # transparently serves Firebase Hosting's OAuth helper resources. This is
        # required for robust signInWithRedirect on browsers that partition or
        # block third-party storage.
        location /__/auth {
            proxy_pass https://configurator-360.firebaseapp.com;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name configurator-360.firebaseapp.com;
            proxy_set_header Host configurator-360.firebaseapp.com;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Consolidate the old locale-prefixed URLs onto the country domains.
        location = /ro {
            if ($is_tenant_host) { return 302 https://$tenant_slug.360configurator.ro/$is_args$args; }
            return 301 https://www.360configurator.ro/; }
        location ~ ^/ro(?<locale_path>/.*)$ {
            if ($is_tenant_host) { return 302 https://$tenant_slug.360configurator.ro$locale_path$is_args$args; }
            return 301 https://www.360configurator.ro$locale_path; }
        location = /de {
            if ($is_tenant_host) { return 302 https://$tenant_slug.360konfigurator.de/$is_args$args; }
            return 301 https://www.360konfigurator.de/; }
        location ~ ^/de(?<locale_path>/.*)$ {
            if ($is_tenant_host) { return 302 https://$tenant_slug.360konfigurator.de$locale_path$is_args$args; }
            return 301 https://www.360konfigurator.de$locale_path; }

        # Host-aware robots and sitemap responses. Each country domain exposes
        # only its own canonical, indexable URLs through /sitemap.xml.
        location = /robots.txt {
            if ($is_tenant_host) { return 200 "User-agent: *\nDisallow: /\n"; }
            default_type text/plain;
            return 200 "User-agent: *\nAllow: /\nSitemap: $public_origin/sitemap.xml\n";
        }

        location = /sitemap.xml {
            if ($is_tenant_host) { return 404; }
            default_type application/xml;
            try_files $sitemap_file =404;
        }


        # Same-origin guest localization endpoint. Cloudflare supplies
        # CF-IPCountry when the public domains are proxied through the edge.
        location = /api/region-defaults {
            default_type application/json;
            add_header Cache-Control "private, no-store, max-age=0" always;
            add_header Access-Control-Allow-Origin "*" always;
            return 200 '{"countryCode":"$geo_country_code"}';
        }

        # Solar configurator -> same-origin Overpass proxy.
        location = /api/solar/overpass-primary {
            proxy_pass https://overpass-api.de/api/interpreter;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name overpass-api.de;
            proxy_set_header Host overpass-api.de;
            proxy_set_header Connection "";
            proxy_set_header User-Agent "360ConfiguratorSolar/1.0 (+https://www.360configurator.com/solar-configurator/)";
            proxy_set_header Referer "https://www.360configurator.com/solar-configurator/";
            proxy_set_header Origin "";
            proxy_set_header Sec-Fetch-Site "";
            proxy_set_header Sec-Fetch-Mode "";
            proxy_set_header Sec-Fetch-Dest "";
            proxy_set_header Sec-GPC "";
            proxy_set_header DNT "";
            proxy_set_header Accept-Language "";
            proxy_set_header Accept "application/json";
            proxy_set_header Content-Type "application/x-www-form-urlencoded";
            proxy_connect_timeout 10s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        location = /api/solar/overpass-secondary {
            proxy_pass https://overpass.private.coffee/api/interpreter;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name overpass.private.coffee;
            proxy_set_header Host overpass.private.coffee;
            proxy_set_header Connection "";
            proxy_set_header User-Agent "360ConfiguratorSolar/1.0 (+https://www.360configurator.com/solar-configurator/)";
            proxy_set_header Referer "https://www.360configurator.com/solar-configurator/";
            proxy_set_header Origin "";
            proxy_set_header Sec-Fetch-Site "";
            proxy_set_header Sec-Fetch-Mode "";
            proxy_set_header Sec-Fetch-Dest "";
            proxy_set_header Sec-GPC "";
            proxy_set_header DNT "";
            proxy_set_header Accept-Language "";
            proxy_set_header Accept "application/json";
            proxy_set_header Content-Type "application/x-www-form-urlencoded";
            proxy_connect_timeout 10s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # Romanian full-configurator aliases.
        location = /configurator-pergola {
            if ($is_tenant_host) { return 302 /pergola-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-pergola/; }
        location /configurator-pergola/ {
            if ($is_tenant_host) { rewrite ^/configurator-pergola/(.*)$ /pergola-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-pergola/(.*)$ /pergola-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /pergola-configurator/index.html;
        }
        location = /configurator-acoperis {
            if ($is_tenant_host) { return 302 /roof-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-acoperis/; }
        location /configurator-acoperis/ {
            if ($is_tenant_host) { rewrite ^/configurator-acoperis/(.*)$ /roof-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-acoperis/(.*)$ /roof-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /roof-configurator/index.html;
        }
        location = /configurator-ferestre {
            if ($is_tenant_host) { return 302 /window-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-ferestre/; }
        location /configurator-ferestre/ {
            if ($is_tenant_host) { rewrite ^/configurator-ferestre/(.*)$ /window-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-ferestre/(.*)$ /window-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /window-configurator/index.html;
        }
        location = /configurator-hala {
            if ($is_tenant_host) { return 302 /hall-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-hala/; }
        location /configurator-hala/ {
            if ($is_tenant_host) { rewrite ^/configurator-hala/(.*)$ /hall-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-hala/(.*)$ /hall-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /hall-configurator/index.html;
        }
        location = /configurator-solar {
            if ($is_tenant_host) { return 302 /solar-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-solar/; }
        location /configurator-solar/ {
            if ($is_tenant_host) { rewrite ^/configurator-solar/(.*)$ /solar-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-solar/(.*)$ /solar-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /solar-configurator/index.html;
        }
        location = /configurator-garduri {
            if ($is_tenant_host) { return 302 /fence-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-garduri/; }
        location /configurator-garduri/ {
            if ($is_tenant_host) { rewrite ^/configurator-garduri/(.*)$ /fence-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-garduri/(.*)$ /fence-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /fence-configurator/index.html;
        }
        location = /configurator-cutii-carton {
            if ($is_tenant_host) { return 302 /cardbox-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-cutii-carton/; }
        location /configurator-cutii-carton/ {
            if ($is_tenant_host) { rewrite ^/configurator-cutii-carton/(.*)$ /cardbox-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-cutii-carton/(.*)$ /cardbox-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /cardbox-configurator/index.html;
        }


        location = /configurator-scaune {
            if ($is_tenant_host) { return 302 /chair-configurator/$is_args$args; }
            return 301 https://www.360configurator.ro/configurator-scaune/; }
        location /configurator-scaune/ {
            if ($is_tenant_host) { rewrite ^/configurator-scaune/(.*)$ /chair-configurator/$1 last; }
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-scaune/(.*)$ /chair-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /chair-configurator/index.html;
        }

        # German full-configurator aliases.
        location = /pergola-konfigurator {
            if ($is_tenant_host) { return 302 /pergola-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/pergola-konfigurator/; }
        location /pergola-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/pergola-konfigurator/(.*)$ /pergola-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/pergola-konfigurator/(.*)$ /pergola-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /pergola-configurator/index.html;
        }
        location = /dach-konfigurator {
            if ($is_tenant_host) { return 302 /roof-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/dach-konfigurator/; }
        location /dach-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/dach-konfigurator/(.*)$ /roof-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/dach-konfigurator/(.*)$ /roof-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /roof-configurator/index.html;
        }
        location = /fenster-konfigurator {
            if ($is_tenant_host) { return 302 /window-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/fenster-konfigurator/; }
        location /fenster-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/fenster-konfigurator/(.*)$ /window-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/fenster-konfigurator/(.*)$ /window-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /window-configurator/index.html;
        }
        location = /hallen-konfigurator {
            if ($is_tenant_host) { return 302 /hall-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/hallen-konfigurator/; }
        location /hallen-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/hallen-konfigurator/(.*)$ /hall-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/hallen-konfigurator/(.*)$ /hall-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /hall-configurator/index.html;
        }
        location = /solar-konfigurator {
            if ($is_tenant_host) { return 302 /solar-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/solar-konfigurator/; }
        location /solar-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/solar-konfigurator/(.*)$ /solar-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/solar-konfigurator/(.*)$ /solar-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /solar-configurator/index.html;
        }
        location = /zaun-konfigurator {
            if ($is_tenant_host) { return 302 /fence-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/zaun-konfigurator/; }
        location /zaun-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/zaun-konfigurator/(.*)$ /fence-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/zaun-konfigurator/(.*)$ /fence-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /fence-configurator/index.html;
        }
        location = /karton-konfigurator {
            if ($is_tenant_host) { return 302 /cardbox-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/karton-konfigurator/; }
        location /karton-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/karton-konfigurator/(.*)$ /cardbox-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/karton-konfigurator/(.*)$ /cardbox-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /cardbox-configurator/index.html;
        }


        location = /stuhl-konfigurator {
            if ($is_tenant_host) { return 302 /chair-configurator/$is_args$args; }
            return 301 https://www.360konfigurator.de/stuhl-konfigurator/; }
        location /stuhl-konfigurator/ {
            if ($is_tenant_host) { rewrite ^/stuhl-konfigurator/(.*)$ /chair-configurator/$1 last; }
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/stuhl-konfigurator/(.*)$ /chair-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /chair-configurator/index.html;
        }

        # English routes remain canonical on .com and redirect to localized paths
        # when requested through a country domain.
        location = /window-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-ferestre/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/fenster-konfigurator/; }
            return 301 /window-configurator/;
        }
        location /window-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-ferestre/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/fenster-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /window-configurator/index.html;
        }
        location = /pergola-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-pergola/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/pergola-konfigurator/; }
            return 301 /pergola-configurator/;
        }
        location /pergola-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-pergola/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/pergola-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /pergola-configurator/index.html;
        }
        location = /roof-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-acoperis/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/dach-konfigurator/; }
            return 301 /roof-configurator/;
        }
        location /roof-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-acoperis/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/dach-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /roof-configurator/index.html;
        }
        location = /solar-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-solar/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/solar-konfigurator/; }
            return 301 /solar-configurator/;
        }
        location /solar-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-solar/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/solar-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /solar-configurator/index.html;
        }
        location = /hall-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-hala/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/hallen-konfigurator/; }
            return 301 /hall-configurator/;
        }
        location /hall-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-hala/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/hallen-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /hall-configurator/index.html;
        }
        location = /fence-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-garduri/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/zaun-konfigurator/; }
            return 301 /fence-configurator/;
        }
        location /fence-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-garduri/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/zaun-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /fence-configurator/index.html;
        }
        location = /cardbox-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-cutii-carton/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/karton-konfigurator/; }
            return 301 /cardbox-configurator/;
        }
        location /cardbox-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-cutii-carton/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/karton-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /cardbox-configurator/index.html;
        }


        location = /chair-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-scaune/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/stuhl-konfigurator/; }
            return 301 /chair-configurator/;
        }
        location /chair-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-scaune/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/stuhl-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /chair-configurator/index.html;
        }

        # Modular bookshelf configurator. Keep its non-indexed public route;
        # tenant access is now included in the standard catalogue and guarded
        # by the same entitlement bootstrap as the other configurators.
        location = /bookshelf-configurator {
            return 301 /bookshelf-configurator/;
        }
        location /bookshelf-configurator/ {
            try_files $uri/index.html $uri $uri/ /bookshelf-configurator/index.html;
        }

        # Pavement prototype, available on every language domain.
        location = /tiles { return 302 /tiles-configurator/; }
        location = /tiles/ { return 302 /tiles-configurator/; }
        location = /tiles-configurator { return 301 /tiles-configurator/; }
        location /tiles-configurator/ {
            try_files $uri/index.html $uri $uri/ =404;
        }

        # The gas configurator remains a non-indexed prototype. It intentionally
        # uses one route on all language domains until public launch naming and
        # marketing pages are approved.
        location = /gas-configurator {
            return 301 /gas-configurator/;
        }
        location /gas-configurator/ {
            try_files $uri/index.html $uri $uri/ /gas-configurator/index.html;
        }

        # Internal Tier-1 provisioning UI. The URL is intentionally not linked
        # from the public site; backend authorization is still the security boundary.
        location = /internal/tenant-provisioning {
            if ($is_internal_admin_host = 0) { return 404; }
            return 301 /internal/tenant-provisioning/;
        }
        location = /internal/tenant-provisioning/ {
            if ($is_internal_admin_host = 0) { return 404; }
            try_files /shared-ui/admin/tenant-provisioning/index.html =404;
        }

        # The canonical public-platform host uses /dashboard/ for the internal
        # sales dashboard. Tier-1 wildcard hosts keep their existing customer
        # self-service dashboard on the same path. Firebase authorization is the
        # security boundary for both applications.
        location = /dashboard {
            if ($is_internal_admin_host = 1) { return 301 /dashboard/; }
            if ($is_tenant_host = 0) { return 404; }
            return 301 /dashboard/;
        }
        location = /dashboard/ {
            if ($is_internal_admin_host = 1) { rewrite ^ /shared-ui/admin/sales-dashboard/index.html last; }
            if ($is_tenant_host = 0) { return 404; }
            try_files /shared-ui/tenant-dashboard/index.html =404;
        }

        location /shared-ui/ {
            try_files $uri =404;
        }

        location /shared-3d/ {
            try_files $uri =404;
        }

        # A wildcard customer hostname gets a small tenant launcher at /.
        # Other non-configurator website routes are intentionally unavailable on
        # customer hosts so the 360Configurator marketing site is not leaked as
        # if it belonged to that customer.
        location = / {
            if ($is_tenant_host = 1) { rewrite ^ /shared-ui/tenant/index.html last; }
            try_files $site_prefix/index.html /index.html =404;
        }

        # Country-domain host selects the localized pre-rendered website tree.
        location / {
            if ($is_tenant_host = 1) { return 404; }
            try_files $site_prefix$uri/index.html
                    $site_prefix$uri
                    $uri/index.html
                    $uri
                    $uri/
                    =404;
        }
    }
}
