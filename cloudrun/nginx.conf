events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $host $site_prefix {
        default "";
        www.360configurator.ro /ro;
        www.360konfigurator.de /de;
    }

    map $host $public_origin {
        default https://www.360configurator.com;
        www.360configurator.ro https://www.360configurator.ro;
        www.360konfigurator.de https://www.360konfigurator.de;
    }

    map $host $sitemap_file {
        default /sitemap-en.xml;
        www.360configurator.ro /sitemap-ro.xml;
        www.360konfigurator.de /sitemap-de.xml;
    }

    # Tier-1 customer sites are resolved by the application from the first
    # label of *.360configurator.com. Exact platform hosts remain normal sites.
    map $host $is_tenant_host {
        default 0;
        www.360configurator.com 0;
        aks.360configurator.com 0;
        ~^[a-z0-9]\.360configurator\.com$ 1;
        ~^[a-z0-9][a-z0-9-]*[a-z0-9]\.360configurator\.com$ 1;
    }

    server {
        listen 8080;
        server_name 360configurator.com;
        return 301 https://www.360configurator.com$request_uri;
    }

    server {
        listen 8080;
        server_name 360configurator.ro;
        return 301 https://www.360configurator.ro$request_uri;
    }

    server {
        listen 8080;
        server_name 360konfigurator.de;
        return 301 https://www.360konfigurator.de$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name www.360configurator.com aks.360configurator.com www.360configurator.ro www.360konfigurator.de _;

        root /usr/share/nginx/html;
        index index.html;

        # Consolidate the old locale-prefixed URLs onto the country domains.
        location = /ro { return 301 https://www.360configurator.ro/; }
        location ~ ^/ro(?<locale_path>/.*)$ { return 301 https://www.360configurator.ro$locale_path; }
        location = /de { return 301 https://www.360konfigurator.de/; }
        location ~ ^/de(?<locale_path>/.*)$ { return 301 https://www.360konfigurator.de$locale_path; }

        # Host-aware robots and sitemap responses. Each country domain exposes
        # only its own canonical, indexable URLs through /sitemap.xml.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nAllow: /\nSitemap: $public_origin/sitemap.xml\n";
        }

        location = /sitemap.xml {
            default_type application/xml;
            try_files $sitemap_file =404;
        }

        # Solar configurator -> same-origin Overpass proxy.
        location = /api/solar/overpass-primary {
            proxy_pass https://overpass-api.de/api/interpreter;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name overpass-api.de;
            proxy_set_header Host overpass-api.de;
            proxy_set_header Connection "";
            proxy_set_header User-Agent "360ConfiguratorSolar/1.0 (+https://www.360configurator.com/solar-configurator/)";
            proxy_set_header Referer "https://www.360configurator.com/solar-configurator/";
            proxy_set_header Origin "";
            proxy_set_header Sec-Fetch-Site "";
            proxy_set_header Sec-Fetch-Mode "";
            proxy_set_header Sec-Fetch-Dest "";
            proxy_set_header Sec-GPC "";
            proxy_set_header DNT "";
            proxy_set_header Accept-Language "";
            proxy_set_header Accept "application/json";
            proxy_set_header Content-Type "application/x-www-form-urlencoded";
            proxy_connect_timeout 10s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        location = /api/solar/overpass-secondary {
            proxy_pass https://overpass.private.coffee/api/interpreter;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name overpass.private.coffee;
            proxy_set_header Host overpass.private.coffee;
            proxy_set_header Connection "";
            proxy_set_header User-Agent "360ConfiguratorSolar/1.0 (+https://www.360configurator.com/solar-configurator/)";
            proxy_set_header Referer "https://www.360configurator.com/solar-configurator/";
            proxy_set_header Origin "";
            proxy_set_header Sec-Fetch-Site "";
            proxy_set_header Sec-Fetch-Mode "";
            proxy_set_header Sec-Fetch-Dest "";
            proxy_set_header Sec-GPC "";
            proxy_set_header DNT "";
            proxy_set_header Accept-Language "";
            proxy_set_header Accept "application/json";
            proxy_set_header Content-Type "application/x-www-form-urlencoded";
            proxy_connect_timeout 10s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # Romanian full-configurator aliases.
        location = /configurator-pergola { return 301 https://www.360configurator.ro/configurator-pergola/; }
        location /configurator-pergola/ {
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-pergola/(.*)$ /pergola-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /pergola-configurator/index.html;
        }
        location = /configurator-acoperis { return 301 https://www.360configurator.ro/configurator-acoperis/; }
        location /configurator-acoperis/ {
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-acoperis/(.*)$ /roof-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /roof-configurator/index.html;
        }
        location = /configurator-ferestre { return 301 https://www.360configurator.ro/configurator-ferestre/; }
        location /configurator-ferestre/ {
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-ferestre/(.*)$ /window-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /window-configurator/index.html;
        }
        location = /configurator-hala { return 301 https://www.360configurator.ro/configurator-hala/; }
        location /configurator-hala/ {
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-hala/(.*)$ /hall-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /hall-configurator/index.html;
        }
        location = /configurator-solar { return 301 https://www.360configurator.ro/configurator-solar/; }
        location /configurator-solar/ {
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-solar/(.*)$ /solar-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /solar-configurator/index.html;
        }
        location = /configurator-garduri { return 301 https://www.360configurator.ro/configurator-garduri/; }
        location /configurator-garduri/ {
            if ($host != www.360configurator.ro) { return 301 https://www.360configurator.ro$request_uri; }
            rewrite ^/configurator-garduri/(.*)$ /fence-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /fence-configurator/index.html;
        }

        # German full-configurator aliases.
        location = /pergola-konfigurator { return 301 https://www.360konfigurator.de/pergola-konfigurator/; }
        location /pergola-konfigurator/ {
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/pergola-konfigurator/(.*)$ /pergola-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /pergola-configurator/index.html;
        }
        location = /dach-konfigurator { return 301 https://www.360konfigurator.de/dach-konfigurator/; }
        location /dach-konfigurator/ {
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/dach-konfigurator/(.*)$ /roof-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /roof-configurator/index.html;
        }
        location = /fenster-konfigurator { return 301 https://www.360konfigurator.de/fenster-konfigurator/; }
        location /fenster-konfigurator/ {
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/fenster-konfigurator/(.*)$ /window-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /window-configurator/index.html;
        }
        location = /hallen-konfigurator { return 301 https://www.360konfigurator.de/hallen-konfigurator/; }
        location /hallen-konfigurator/ {
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/hallen-konfigurator/(.*)$ /hall-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /hall-configurator/index.html;
        }
        location = /solar-konfigurator { return 301 https://www.360konfigurator.de/solar-konfigurator/; }
        location /solar-konfigurator/ {
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/solar-konfigurator/(.*)$ /solar-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /solar-configurator/index.html;
        }
        location = /zaun-konfigurator { return 301 https://www.360konfigurator.de/zaun-konfigurator/; }
        location /zaun-konfigurator/ {
            if ($host != www.360konfigurator.de) { return 301 https://www.360konfigurator.de$request_uri; }
            rewrite ^/zaun-konfigurator/(.*)$ /fence-configurator/$1 break;
            try_files $uri/index.html $uri $uri/ /fence-configurator/index.html;
        }

        # English routes remain canonical on .com and redirect to localized paths
        # when requested through a country domain.
        location = /window-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-ferestre/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/fenster-konfigurator/; }
            return 301 /window-configurator/;
        }
        location /window-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-ferestre/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/fenster-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /window-configurator/index.html;
        }
        location = /pergola-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-pergola/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/pergola-konfigurator/; }
            return 301 /pergola-configurator/;
        }
        location /pergola-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-pergola/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/pergola-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /pergola-configurator/index.html;
        }
        location = /roof-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-acoperis/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/dach-konfigurator/; }
            return 301 /roof-configurator/;
        }
        location /roof-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-acoperis/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/dach-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /roof-configurator/index.html;
        }
        location = /solar-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-solar/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/solar-konfigurator/; }
            return 301 /solar-configurator/;
        }
        location /solar-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-solar/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/solar-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /solar-configurator/index.html;
        }
        location = /hall-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-hala/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/hallen-konfigurator/; }
            return 301 /hall-configurator/;
        }
        location /hall-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-hala/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/hallen-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /hall-configurator/index.html;
        }
        location = /fence-configurator {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-garduri/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/zaun-konfigurator/; }
            return 301 /fence-configurator/;
        }
        location /fence-configurator/ {
            if ($host = www.360configurator.ro) { return 301 https://www.360configurator.ro/configurator-garduri/; }
            if ($host = www.360konfigurator.de) { return 301 https://www.360konfigurator.de/zaun-konfigurator/; }
            try_files $uri/index.html $uri $uri/ /fence-configurator/index.html;
        }

        location /shared-ui/ {
            try_files $uri =404;
        }

        # A wildcard customer hostname gets a small tenant launcher at /.
        # Other non-configurator website routes are intentionally unavailable on
        # customer hosts so the 360Configurator marketing site is not leaked as
        # if it belonged to that customer.
        location = / {
            if ($is_tenant_host = 1) { rewrite ^ /shared-ui/tenant/index.html last; }
            try_files $site_prefix/index.html /index.html =404;
        }

        # Country-domain host selects the localized pre-rendered website tree.
        location / {
            if ($is_tenant_host = 1) { return 404; }
            try_files $site_prefix$uri/index.html
                    $site_prefix$uri
                    $uri/index.html
                    $uri
                    $uri/
                    =404;
        }
    }
}
