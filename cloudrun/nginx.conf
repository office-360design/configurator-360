        "~^1:(?:GET|HEAD):/ro:/paving-configurator/?(?:\?.*)?$" /configuratoare/pavaje;
        # de: each page under the domain's own slug; the old English slugs move there.
        "~^1:(?:GET|HEAD):/de:/about(?:/index\.html|/)?(?:\?.*)?$" /ueber-uns;
        "~^1:(?:GET|HEAD):/de:/ueber-uns(?:/index\.html|/)(?:\?.*)?$" /ueber-uns;
