        }
        location = /internal/tenant-provisioning/ {
            if ($is_internal_admin_host = 0) { return 404; }
            try_files /shared-ui/admin/tenant-provisioning/index.html =404;
        }

        # The canonical public-platform host uses /dashboard/ for the internal
        # sales dashboard. Tier-1 wildcard hosts keep their existing customer
        # self-service dashboard on the same path. Firebase authorization is the
        # security boundary for both applications.
        location = /dashboard {
            if ($is_internal_admin_host = 1) { return 301 /dashboard/; }
            if ($is_tenant_host = 0) { return 404; }
            return 301 /dashboard/;
        }
        location = /dashboard/ {
            if ($is_internal_admin_host = 1) { rewrite ^ /shared-ui/admin/sales-dashboard/index.html last; }
            if ($is_tenant_host = 0) { return 404; }
            try_files /shared-ui/tenant-dashboard/index.html =404;
        }

        location /shared-ui/ {
            gzip off;
            try_files $uri =404;
        }

        location /shared-3d/ {
            try_files $uri =404;
        }

        # Website build assets have content hashes. No cache policy changes for
        # full apps, tenant HTML, auth, API or administration routes.
        location ^~ /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location ^~ /styles/ {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            try_files $uri =404;
        }
        location ^~ /lite-assets/ {
            add_header Cache-Control "public, max-age=86400, must-revalidate";
            try_files $uri =404;
        }
        location = /llms.txt {
            if ($is_tenant_host) { return 404; }
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            try_files $llms_file =404;
        }
        location = /llms-full.txt {
            if ($is_tenant_host) { return 404; }
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            try_files $llms_full_file =404;
        }

        # A wildcard customer hostname gets a small tenant launcher at /.
        # Other non-configurator website routes are intentionally unavailable on
        # customer hosts so the 360Configurator marketing site is not leaked as
        # if it belonged to that customer.
        location = / {
            if ($is_tenant_host = 1) { rewrite ^ /shared-ui/tenant/index.html last; }
            try_files $site_prefix/index.html /index.html =404;
        }

        # Country-domain host selects the localized pre-rendered website tree.
        location / {
            if ($is_tenant_host = 1) { return 404; }
            try_files $site_prefix$uri/index.html
                    $site_prefix$uri
                    $uri/index.html
                    $uri
                    $uri/
                    =404;
        }
    }
}
