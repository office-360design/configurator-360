        # es: each page under the domain's own slug; the old English slugs move there.
        "~^1:(?:GET|HEAD):/es:/about(?:/index\.html|/)?(?:\?.*)?$" /sobre-nosotros;
        "~^1:(?:GET|HEAD):/es:/sobre-nosotros(?:/index\.html|/)(?:\?.*)?$" /sobre-nosotros;
