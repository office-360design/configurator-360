events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # Compress text; image formats are already compressed. Vary prevents shared
    # caches serving gzip to clients that did not negotiate it.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    map $host $llms_file {
        default /llms.txt;
        www.360configurator.ro /llms-ro.txt;
        www.360konfigurator.de /llms-de.txt;
        www.360configurador.es /llms-es.txt;
        www.360configurateur.fr /llms-fr.txt;
        www.360configuratore.it /llms-it.txt;
    }
    map $host $llms_full_file {
        default /llms-full.txt;
        www.360configurator.ro /llms-full-ro.txt;
        www.360konfigurator.de /llms-full-de.txt;
        www.360configurador.es /llms-full-es.txt;
        www.360configurateur.fr /llms-full-fr.txt;
        www.360configuratore.it /llms-full-it.txt;
    }


    # Edge-provided visitor country used only to choose guest UI defaults.
    # The client IP itself is never returned to the browser.
    map $http_cf_ipcountry $geo_country_code {
        default $http_cf_ipcountry;
        "" $http_x_country_code;
    }

    map $host $site_prefix {
        default "";
        www.360configurator.ro /ro;
        www.360konfigurator.de /de;
        www.360configurador.es /es;
        www.360configurateur.fr /fr;
        www.360configuratore.it /it;
    }

    map $host $public_origin {
        default https://www.360configurator.com;
        www.360configurator.ro https://www.360configurator.ro;
        www.360konfigurator.de https://www.360konfigurator.de;
        www.360configurador.es https://www.360configurador.es;
        www.360configurateur.fr https://www.360configurateur.fr;
        www.360configuratore.it https://www.360configuratore.it;
    }

    map $host $sitemap_file {
        default /sitemap-en.xml;
        www.360configurator.ro /sitemap-ro.xml;
        www.360konfigurator.de /sitemap-de.xml;
        www.360configurador.es /sitemap-es.xml;
        www.360configurateur.fr /sitemap-fr.xml;
        www.360configuratore.it /sitemap-it.xml;
    }

    map $host $is_internal_admin_host {
        default 0;
        www.360configurator.com 1;
    }

    # One customer identity across the six supported country domains.
    # Reserved names never become tenants, even though wildcard DNS resolves.
    map $host $tenant_slug {
        default "";
        "~^(?:www|aks|admin|api|app|assets|auth|billing|cdn|demo|dev|ftp|mail|staging|static|status|support|test)\.(?:360configurator\.com|360configurator\.ro|360konfigurator\.de|360configurador\.es|360configurateur\.fr|360configuratore\.it)$" "";
        "~^(?<customer_slug>[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?)\.(?:360configurator\.com|360configurator\.ro|360konfigurator\.de|360configurador\.es|360configurateur\.fr|360configuratore\.it)$" $customer_slug;
    }

    map $tenant_slug $is_tenant_host {
        "" 0;
        default 1;
    }

    map $host $is_public_marketing_host {
        default 0;
        www.360configurator.com 1;
        www.360configurator.ro 1;
        www.360konfigurator.de 1;
        www.360configurador.es 1;
        www.360configurateur.fr 1;
        www.360configuratore.it 1;
    }

    # BEGIN generated website slugs (scripts/build/sync-website-slugs.mjs; edit website/lib/page-slugs.json)
    # Only known marketing documents are redirected. Match the ORIGINAL URI to avoid
    # loops after try_files; never touch app, asset or API paths. Tenant hosts and
    # non-read requests are outside this rule ($is_public_marketing_host).
    map "$is_public_marketing_host:$request_method:$site_prefix:$request_uri" $marketing_redirect {
        default "";
        # English site: slash and index.html normalisation.
        "~^1:(?:GET|HEAD)::/(?<marketing_page>about|contact|pricing|book-a-demo|configurators/window|configurators/hall|configurators/fence|configurators/tiles|configurators/pergola|configurators/roof|configurators/solar|configurators/chair|configurators/cardbox|configurators/bookshelf)(?:/index\.html|/)(?:\?.*)?$" /$marketing_page;
        "~^1:(?:GET|HEAD):(?:/[a-z]{2})?:/index\.html(?:\?.*)?$" /;
        # Old portfolio now lives in the homepage's real deployed-systems list.
        "~^1:(?:GET|HEAD):(?:/[a-z]{2})?:/our-work/?(?:\?.*)?$" /;
        # Same product, not a generic redirect to an unrelated page.
        "~^1:(?:GET|HEAD)::/paving-configurator/?(?:\?.*)?$" /configurators/tiles;
        # ro: each page under the domain's own slug; the old English slugs move there.
        "~^1:(?:GET|HEAD):/ro:/about(?:/index\.html|/)?(?:\?.*)?$" /despre-noi;
        "~^1:(?:GET|HEAD):/ro:/despre-noi(?:/index\.html|/)(?:\?.*)?$" /despre-noi;
        "~^1:(?:GET|HEAD):/ro:/contact(?:/index\.html|/)(?:\?.*)?$" /contact;
        "~^1:(?:GET|HEAD):/ro:/pricing(?:/index\.html|/)?(?:\?.*)?$" /preturi;
        "~^1:(?:GET|HEAD):/ro:/preturi(?:/index\.html|/)(?:\?.*)?$" /preturi;
        "~^1:(?:GET|HEAD):/ro:/book-a-demo(?:/index\.html|/)?(?:\?.*)?$" /programeaza-demo;
        "~^1:(?:GET|HEAD):/ro:/programeaza-demo(?:/index\.html|/)(?:\?.*)?$" /programeaza-demo;
        "~^1:(?:GET|HEAD):/ro:/configurators/window(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/ferestre;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/ferestre(?:/index\.html|/)(?:\?.*)?$" /configuratoare/ferestre;
        "~^1:(?:GET|HEAD):/ro:/configurators/hall(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/hale;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/hale(?:/index\.html|/)(?:\?.*)?$" /configuratoare/hale;
        "~^1:(?:GET|HEAD):/ro:/configurators/fence(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/garduri;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/garduri(?:/index\.html|/)(?:\?.*)?$" /configuratoare/garduri;
        "~^1:(?:GET|HEAD):/ro:/configurators/tiles(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/pavaje;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/pavaje(?:/index\.html|/)(?:\?.*)?$" /configuratoare/pavaje;
        "~^1:(?:GET|HEAD):/ro:/configurators/pergola(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/pergole;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/pergole(?:/index\.html|/)(?:\?.*)?$" /configuratoare/pergole;
        "~^1:(?:GET|HEAD):/ro:/configurators/roof(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/acoperisuri;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/acoperisuri(?:/index\.html|/)(?:\?.*)?$" /configuratoare/acoperisuri;
        "~^1:(?:GET|HEAD):/ro:/configurators/solar(?:/index\.html|/)?(?:\?.*)?$" /configuratoare/fotovoltaice;
        "~^1:(?:GET|HEAD):/ro:/configuratoare/fotovoltaice(?:/index\.html|/)(?:\?.*)?$" /configuratoare/fotovoltaice;
