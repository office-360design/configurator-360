name: Validate tenant catalogue

on:
  push:
    branches: [tenants]
    paths:
      - '.github/workflows/validate-tenant-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/tenants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source snapshot for local regression checks
        run: git archive --format=zip HEAD -o tenant-catalogue-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tenant-catalogue-source
          path: tenant-catalogue-source.zip
          retention-days: 1
      - name: Existing tenant checks
        shell: bash
        run: |
          status=0
          for check in tenant tenant-provisioning tenant-auth tenant-saves tenant-lifecycle tenant-subscription tenant-plan-changes tenant-usage analytics tenant-dashboard tenant-audit; do
            npm run "check:$check" || status=1
          done
          exit "$status"
