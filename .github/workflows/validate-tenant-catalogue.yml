name: Validate tenant catalogue

on:
  push:
    branches: [tenants]
    paths:
      - '.github/workflows/validate-tenant-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/tenants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect tenant catalogue integration
        shell: bash
        run: |
          echo '=== Repository instructions ==='
          find . -name AGENTS.md -not -path './node_modules/*' -print
          echo '=== Tenant catalogue consumers ==='
          git grep -n -E 'TENANT_CONFIGURATORS|ALLOWED_PRODUCTS|maxConfigurators:|All [0-9]+ standard|PRODUCT_LABELS|PRODUCT_TYPES|CONFIGURATOR_LABELS' -- shared-ui firebase-share-backend scripts/validation || true
          echo '=== New configurator entry points ==='
          git grep -n -E 'requireTenantConfiguratorAccess|standaloneShell|mountStandalone|productType:|productId:|onAddToCart|onRequestQuote|tenantBootstrap' -- tiles-configurator cardbox-configurator chair-configurator bookshelf-configurator || true
          echo '=== Routes and UI product lists ==='
          git grep -n -E 'cardbox|tiles|chair|bookshelf' -- shared-ui/admin shared-ui/tenant shared-ui/tenant-dashboard cloudrun firebase-share-backend/firestore.rules || true
      - name: Existing tenant checks
        shell: bash
        run: |
          status=0
          for check in tenant tenant-provisioning tenant-auth tenant-saves tenant-lifecycle tenant-subscription tenant-plan-changes tenant-usage analytics tenant-dashboard tenant-audit; do
            npm run "check:$check" || status=1
          done
          exit "$status"
