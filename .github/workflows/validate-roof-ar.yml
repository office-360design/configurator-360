name: Validate Roof AR

on:
  pull_request:
    paths:
      - 'roof-configurator/**'
      - 'shared-ui/**'
      - 'shared-3d/**'
      - 'firebase-share-backend/functions/hall-ar*'
      - 'firebase-share-backend/functions/tests/hall-ar.test.cjs'
      - 'bookshelf-configurator/tests/camera-guard.mjs'
      - '.github/workflows/validate-roof-ar.yml'
  push:
    branches: [main]
    paths:
      - 'roof-configurator/**'
      - 'shared-ui/**'
      - 'shared-3d/**'
      - 'firebase-share-backend/functions/hall-ar*'
      - 'firebase-share-backend/functions/tests/hall-ar.test.cjs'
      - 'bookshelf-configurator/tests/camera-guard.mjs'
      - '.github/workflows/validate-roof-ar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roof-ar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Static import-map app: these offline tests use the bundled r160 fixture.
      # The browser/runtime imports in production remain pinned to r169.
      - name: Validate Roof geometry, AR, localization, policy and Firebase serving
        run: |
          npm run check:roof
          node roof-configurator/tools/validate-i18n.mjs
          node --no-warnings --experimental-loader ./roof-configurator/tests/ar-test-loader.mjs --test roof-configurator/tests/roof-ar.test.mjs
          node --test hall-configurator/tests/ar-policy.test.mjs scripts/validation/tenant-branding.test.mjs firebase-share-backend/functions/tests/hall-ar.test.cjs bookshelf-configurator/tests/camera-guard.test.mjs
          node --check roof-configurator/js/scene.js
          node --check roof-configurator/js/sharedShell.js
          node --check roof-configurator/js/ar/controller.js
          node --check roof-configurator/js/ar/exportRoof.js
          node --check roof-configurator/js/ar/phone.js
          node --check shared-ui/src/ar/dialog.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test live Roof configurations, house inclusion and QR dialog
        run: |
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python roof-configurator/tests/ar-browser.py --chromium "$CHROMIUM" --artifacts /tmp/roof-ar-tests
      - name: Upload Roof AR diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roof-ar-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/roof-ar-tests/*.json
            /tmp/roof-ar-tests/*.txt
            /tmp/roof-ar-tests/*.png
