name: Validate single-configurator homepage

on:
  push:
    branches: [tenants]
    paths: ['.github/workflows/tenant-homepage-workbench.yml']

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/tenants'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed homepage setting changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = bb4362ceffab258931a263d962850a6fd10b283b
          python3 .tenant-homepage-update.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('shared-ui/styles/tenantDashboard.css')
          source = path.read_text()
          for old, new in [
              ('.dashboard-workspace { display: grid; gap: 20px; }', '.dashboard-workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }'),
              ('.dashboard-card { padding: 28px; border-radius: 18px; }', '.dashboard-card { min-width: 0; padding: 28px; border-radius: 18px; }'),
          ]:
              assert source.count(old) == 1
              source = source.replace(old, new)
          path.write_text(source)
          PY
          sha256sum -c .tenant-homepage-expected.sha256
      - name: Tenant and configurator regression checks
        run: |
          set -euo pipefail
          for check in tenant tenant-homepage tenant-catalogue tenant-domains tenant-provisioning tenant-auth tenant-saves tenant-lifecycle tenant-subscription tenant-plan-changes tenant-usage analytics tenant-dashboard tenant-audit google-solar-cloudrun tiles; do
            npm run "check:$check"
          done
          node --test scripts/validation/configuration-quotation.test.cjs scripts/validation/configurator-color-editor.test.mjs
          node --check firebase-share-backend/functions/index.js
          for file in shared-ui/src/tenant*.js scripts/validation/tenant-homepage*.mjs; do node --check "$file"; done
          git diff --check
      - name: Install browser and nginx test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Test homepage redirects, settings and existing tenant routes
        run: |
          npm run check:tenant-domains:nginx
          npm run check:tenant-domains:browser
          npm run check:tenant-homepage:browser
          npm run prepare:static --prefix window-configurator
          test -f window-configurator/dist/site/shared-ui/src/tenantHomepage.js
      - name: Publish tested application changes to tenants only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/tenants
          git fetch origin tenants
          test "$(git rev-parse origin/tenants)" = "$GITHUB_SHA"
          git add docs/tenant-country-domains.md firebase-share-backend/functions/index.js package.json shared-ui scripts/validation/validate_tenant_audit_log.mjs scripts/validation/validate_tenant_plan_changes.mjs
          git rm .tenant-homepage-update.py .tenant-homepage-expected.sha256
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tenants): add optional single-configurator homepage redirect'
          git push origin HEAD:refs/heads/tenants
      - name: Record tested source manifest
        if: always()
        run: |
          mkdir -p artifacts
          git ls-files -z | xargs -0 sha256sum > artifacts/tenant-homepage-source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-homepage-validation
          path: |
            artifacts/tenant-homepage*.png
            artifacts/tenant-homepage-source.sha256
          retention-days: 7
