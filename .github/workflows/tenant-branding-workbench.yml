name: Tenant branding workbench

on:
  push:
    branches: [tenants]
    paths: ['.github/workflows/tenant-branding-workbench.yml']

permissions:
  contents: read

jobs:
  snapshot:
    if: github.ref == 'refs/heads/tenants'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o tenant-branding-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tenant-branding-source
          path: tenant-branding-source.zip
          retention-days: 1
