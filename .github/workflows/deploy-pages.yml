name: Deploy configurators to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pergola-configurator/package-lock.json

      # Window configurator / shared static site
      - name: Install window configurator dependencies
        run: npm ci

      - name: Build window configurator
        run: npm run prepare:static

      # Pergola configurator
      - name: Install pergola configurator dependencies
        run: npm ci --prefix pergola-configurator

      - name: Build pergola configurator
        run: npm run build --prefix pergola-configurator

      # Add standalone configurators to the same Pages artifact. These projects
      # import the common ../shared-ui resources already prepared in dist/site.
      - name: Add configurators to Pages output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/site/pergola-configurator
          cp -R pergola-configurator/dist/. dist/site/pergola-configurator/

          if [ -d roof-configurator ]; then
            mkdir -p dist/site/roof-configurator
            cp -R roof-configurator/. dist/site/roof-configurator/
          fi

          if [ -d solar-panel-configurator ]; then
            mkdir -p dist/site/solar-panel-configurator
            cp -R solar-panel-configurator/. dist/site/solar-panel-configurator/
          fi

          mkdir -p dist/site/hall-configurator
          cp -R hall-configurator/. dist/site/hall-configurator/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
