name: Deploy configurator to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          node generate_screenshots_json.js
          cp index.html _site/index.html
          cp ar.html _site/ar.html
          cp ar-viewer.html _site/ar-viewer.html
          cp ar-export.js _site/ar-export.js
          cp ar-upload-config.js _site/ar-upload-config.js
          cp -R svg _site/svg
          cp -R lib _site/lib
          if [ -d cad_screenshots ]; then cp -R cad_screenshots _site/cad_screenshots; fi
          if [ -d icons ]; then cp -R icons _site/icons; fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
