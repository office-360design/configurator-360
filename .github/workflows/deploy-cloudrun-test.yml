name: Deploy test site to Google Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: configurator-360
  GCP_REGION: europe-central2
  GAR_REPOSITORY: configurators
  CLOUD_RUN_SERVICE: configurators-web-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Build window configurator
      # ------------------------------------------------------------

      - name: Configure Node.js for configurators
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pergola-configurator/package-lock.json

      - name: Install window configurator dependencies
        run: npm ci

      - name: Build window configurator
        run: npm run prepare:static

      - name: Preserve window configurator build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/window-configurator-build
          mkdir -p dist/window-configurator-build
          cp -R dist/site/. dist/window-configurator-build/

      # ------------------------------------------------------------
      # Build pergola configurator
      # ------------------------------------------------------------

      - name: Install pergola configurator dependencies
        run: npm ci --prefix pergola-configurator

      - name: Build pergola configurator
        run: npm run build --prefix pergola-configurator

      # ------------------------------------------------------------
      # Build main website
      # ------------------------------------------------------------

      - name: Configure Node.js for website
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build static website
        run: npm run release:static --prefix website

      # ------------------------------------------------------------
      # Assemble exactly the same site currently sent to GitHub Pages
      # ------------------------------------------------------------

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/site
          mkdir -p dist/site

          cp -R website/outputs/release-site/. dist/site/

          mkdir -p dist/site/window-configurator
          cp -R dist/window-configurator-build/. dist/site/window-configurator/

          mkdir -p dist/site/shared-ui
          cp -R shared-ui/. dist/site/shared-ui/

          mkdir -p dist/site/pergola-configurator
          cp -R pergola-configurator/dist/. dist/site/pergola-configurator/

          if [ -d roof-configurator ]; then
            mkdir -p dist/site/roof-configurator
            cp -R roof-configurator/. dist/site/roof-configurator/
          fi

          if [ -d solar-configurator ]; then
            mkdir -p dist/site/solar-configurator
            cp -R solar-configurator/. dist/site/solar-configurator/
          fi

          mkdir -p dist/site/hall-configurator
          cp -R hall-configurator/. dist/site/hall-configurator/

      - name: Verify static site
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/site/index.html
          test -f dist/site/window-configurator/index.html
          test -f dist/site/pergola-configurator/index.html
          test -f dist/site/roof-configurator/index.html
          test -f dist/site/solar-configurator/index.html
          test -f dist/site/hall-configurator/index.html
          test -d dist/site/shared-ui

      # ------------------------------------------------------------
      # Authenticate to Google
      # ------------------------------------------------------------

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # ------------------------------------------------------------
      # Push Docker image to Artifact Registry
      # ------------------------------------------------------------

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Define Docker image
        shell: bash
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/web-test:${GITHUB_SHA}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Docker image: ${IMAGE}"

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.cloudrun \
            -t "${IMAGE}" \
            .

      - name: Push Docker image
        run: |
          docker push "${IMAGE}"

      # ------------------------------------------------------------
      # Deploy test Cloud Run service
      # ------------------------------------------------------------

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --service-account="configurator-runtime@configurator-360.iam.gserviceaccount.com" \
            --port=8080 \
            --allow-unauthenticated \
            --ingress=all \
            --quiet

      # ------------------------------------------------------------
      # Display and test the Cloud Run URL
      # ------------------------------------------------------------

      - name: Get Cloud Run URL
        shell: bash
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"

          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

          echo "## Google Cloud Run test deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${SERVICE_URL}" >> "$GITHUB_STEP_SUMMARY"

          echo "Cloud Run URL: ${SERVICE_URL}"

      - name: Smoke test routes
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ${SERVICE_URL}"

          curl -fsSL --retry 10 --retry-delay 2 "${SERVICE_URL}/" > /dev/null
          curl -fsSL "${SERVICE_URL}/window-configurator/" > /dev/null
          curl -fsSL "${SERVICE_URL}/pergola-configurator/" > /dev/null
          curl -fsSL "${SERVICE_URL}/roof-configurator/" > /dev/null
          curl -fsSL "${SERVICE_URL}/solar-configurator/" > /dev/null
          curl -fsSL "${SERVICE_URL}/hall-configurator/" > /dev/null

          echo "All routes responded successfully."

