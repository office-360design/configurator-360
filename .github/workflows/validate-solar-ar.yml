name: Validate Solar AR

on:
  pull_request:
    paths:
      - 'solar-configurator/**'
      - 'scripts/ci/detect-solar-ar-changes.sh'
      - 'shared-ui/src/ar/**'
      - 'shared-ui/src/arPolicy.js'
      - 'shared-ui/src/standaloneShell.js'
      - 'shared-ui/src/components/topBar.js'
      - 'shared-ui/src/config.js'
      - 'shared-ui/src/tenantBootstrap.js'
      - 'shared-ui/src/tenantCustomization.js'
      - 'shared-ui/src/tenantShellCustomization.js'
      - 'shared-ui/styles/ar.css'
      - 'shared-ui/styles/index.css'
      - 'shared-ui/styles/standalone.css'
      - 'hall-configurator/js/ar/**'
      - 'hall-configurator/ar.html'
      - 'hall-configurator/tests/ar-policy.test.mjs'
      - 'firebase-share-backend/functions/tests/hall-ar.test.cjs'
      - 'firebase-share-backend/functions/entry.js'
      - 'firebase-share-backend/firestore.indexes.json'
      - 'firebase-share-backend/storage*.rules'
      - '.github/workflows/deploy-firebase-share.yml'
      - 'scripts/validation/tenant-branding.test.mjs'
      - 'package*.json'
      - 'shared-3d/**'
      - 'firebase-share-backend/functions/hall-ar*'
      - 'bookshelf-configurator/tests/camera-guard*'
      - 'scripts/validation/validate_tenant_usage_metering.mjs'
      - '.github/workflows/validate-solar-ar.yml'
  push:
    branches: [main]
    paths:
      - 'solar-configurator/**'
      - 'scripts/ci/detect-solar-ar-changes.sh'
      - 'shared-ui/src/ar/**'
      - 'shared-ui/src/arPolicy.js'
      - 'shared-ui/src/standaloneShell.js'
      - 'shared-ui/src/components/topBar.js'
      - 'shared-ui/src/config.js'
      - 'shared-ui/src/tenantBootstrap.js'
      - 'shared-ui/src/tenantCustomization.js'
      - 'shared-ui/src/tenantShellCustomization.js'
      - 'shared-ui/styles/ar.css'
      - 'shared-ui/styles/index.css'
      - 'shared-ui/styles/standalone.css'
      - 'hall-configurator/js/ar/**'
      - 'hall-configurator/ar.html'
      - 'hall-configurator/tests/ar-policy.test.mjs'
      - 'firebase-share-backend/functions/tests/hall-ar.test.cjs'
      - 'firebase-share-backend/functions/entry.js'
      - 'firebase-share-backend/firestore.indexes.json'
      - 'firebase-share-backend/storage*.rules'
      - '.github/workflows/deploy-firebase-share.yml'
      - 'scripts/validation/tenant-branding.test.mjs'
      - 'package*.json'
      - 'shared-3d/**'
      - 'firebase-share-backend/functions/hall-ar*'
      - 'bookshelf-configurator/tests/camera-guard*'
      - 'scripts/validation/validate_tenant_usage_metering.mjs'
      - '.github/workflows/validate-solar-ar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solar-ar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Static import-map app: these offline tests use the bundled r160 fixture.
      # The browser/runtime imports in production remain pinned to r169.
      - name: Validate Solar geometry, AR, localization, policy and Firebase serving
        run: |
          npm run check:ar --prefix solar-configurator
          node --test hall-configurator/tests/ar-policy.test.mjs scripts/validation/tenant-branding.test.mjs firebase-share-backend/functions/tests/hall-ar.test.cjs bookshelf-configurator/tests/camera-guard.test.mjs
          node --check solar-configurator/js/app.js
          node --check solar-configurator/js/scene.js
          node --check solar-configurator/js/sharedShell.js
          node --check solar-configurator/js/ar/controller.js
          node --check solar-configurator/js/ar/exportSolar.js
          node --check solar-configurator/js/ar/phone.js
          node --check shared-ui/src/ar/dialog.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test live Solar configurations, house inclusion and QR dialog
        run: |
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python solar-configurator/tests/ar-browser.py --chromium "$CHROMIUM" --artifacts /tmp/solar-ar-tests
      - name: Install production-version Solar AR test dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix solar-configurator --ignore-scripts
      - name: Test real production GLB and USDZ exporters, QR and phone launchers
        env:
          SOLAR_AR_ARTIFACTS: /tmp/solar-ar-runtime
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run check:ar:browser --prefix solar-configurator
      - name: Upload Solar AR diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solar-ar-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/solar-ar-tests/*.json
            /tmp/solar-ar-tests/*.txt
            /tmp/solar-ar-tests/*.png
            /tmp/solar-ar-runtime/*.json
            /tmp/solar-ar-runtime/*.png

