name: Validate Bookshelf AR

on:
  pull_request:
    paths:
      - 'bookshelf-configurator/**'
      - 'shared-ui/src/ar/**'
      - 'shared-ui/src/arPolicy.js'
      - 'shared-ui/src/standaloneShell.js'
      - 'shared-ui/src/components/topBar.js'
      - 'shared-ui/src/config.js'
      - 'shared-ui/src/tenantBootstrap.js'
      - 'shared-ui/src/tenantCustomization.js'
      - 'shared-ui/src/tenantShellCustomization.js'
      - 'shared-ui/styles/ar.css'
      - 'shared-ui/styles/index.css'
      - 'shared-ui/styles/standalone.css'
      - 'hall-configurator/js/ar/**'
      - 'hall-configurator/ar.html'
      - 'hall-configurator/tests/ar-policy.test.mjs'
      - 'firebase-share-backend/functions/tests/hall-ar.test.cjs'
      - 'firebase-share-backend/functions/entry.js'
      - 'firebase-share-backend/firestore.indexes.json'
      - 'firebase-share-backend/storage*.rules'
      - '.github/workflows/deploy-firebase-share.yml'
      - 'scripts/validation/tenant-branding.test.mjs'
      - 'package*.json'
      - 'shared-3d/**'
      - 'firebase-share-backend/functions/hall-ar*'
      - '.github/workflows/validate-bookshelf-ar.yml'
  push:
    branches: [main]
    paths:
      - 'bookshelf-configurator/**'
      - 'shared-ui/src/ar/**'
      - 'shared-ui/src/arPolicy.js'
      - 'shared-ui/src/standaloneShell.js'
      - 'shared-ui/src/components/topBar.js'
      - 'shared-ui/src/config.js'
      - 'shared-ui/src/tenantBootstrap.js'
      - 'shared-ui/src/tenantCustomization.js'
      - 'shared-ui/src/tenantShellCustomization.js'
      - 'shared-ui/styles/ar.css'
      - 'shared-ui/styles/index.css'
      - 'shared-ui/styles/standalone.css'
      - 'hall-configurator/js/ar/**'
      - 'hall-configurator/ar.html'
      - 'hall-configurator/tests/ar-policy.test.mjs'
      - 'firebase-share-backend/functions/tests/hall-ar.test.cjs'
      - 'firebase-share-backend/functions/entry.js'
      - 'firebase-share-backend/firestore.indexes.json'
      - 'firebase-share-backend/storage*.rules'
      - '.github/workflows/deploy-firebase-share.yml'
      - 'scripts/validation/tenant-branding.test.mjs'
      - 'package*.json'
      - 'shared-3d/**'
      - 'firebase-share-backend/functions/hall-ar*'
      - '.github/workflows/validate-bookshelf-ar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookshelf-ar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # This is a static import-map app. Use the existing offline r160 test
      # fixture; do not install a different root Three runtime or change r169.
      - name: Check Bookshelf exports, policy, branding and Firebase serving
        run: |
          node --test bookshelf-configurator/tests/camera-guard.test.mjs
          node --no-warnings --experimental-loader ./bookshelf-configurator/tests/ar-test-loader.mjs --test bookshelf-configurator/tests/bookshelf-ar.test.mjs
          node --test hall-configurator/tests/ar-policy.test.mjs scripts/validation/tenant-branding.test.mjs firebase-share-backend/functions/tests/hall-ar.test.cjs
          node --check bookshelf-configurator/js/app.js
          node --check bookshelf-configurator/js/sharedShell.js
          node --check bookshelf-configurator/js/ar/controller.js
          node --check bookshelf-configurator/js/ar/exportBookshelf.js
          node --check bookshelf-configurator/js/ar/phone.js
          node --check shared-ui/src/ar/dialog.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test actual bookshelf configurations and shared AR dialog
        run: |
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python bookshelf-configurator/tests/ar-browser.py --chromium "$CHROMIUM" --artifacts /tmp/bookshelf-ar-tests
      - name: Upload Bookshelf AR diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bookshelf-ar-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/bookshelf-ar-tests/*.json
            /tmp/bookshelf-ar-tests/*.txt
            /tmp/bookshelf-ar-tests/*.png

